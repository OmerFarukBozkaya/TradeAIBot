services:
  tradeai:
    build:
      context: .
      args:
        INSTALL_AI: "false"
    container_name: tradeai
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TRADEAI_PORT:-8080}:${TRADEAI_PORT:-8080}"
    env_file:
      - .env
    environment:
      - TZ=Europe/Istanbul
    volumes:
      - ./Data:/app/Data
      - ./Log:/app/Log
      - ./state:/app/state
      - ./Trade_Durumu:/app/Trade_Durumu
      - ./Trade_Durumu_AI:/app/Trade_Durumu_AI
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, urllib.request; urllib.request.urlopen('http://localhost:%s/api/health' % os.getenv('TRADEAI_PORT', '8080'))\""]
      interval: 30s
      timeout: 5s
      retries: 3

  ai:
    profiles: ["ai"]
    build:
      context: .
      dockerfile: Dockerfile.ai
    container_name: tradeai-ai
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Europe/Istanbul
      - AI_ENABLED=true
    volumes:
      - ./Data:/app/Data
      - ./Log:/app/Log
      - ./state:/app/state
    depends_on:
      - tradeai
