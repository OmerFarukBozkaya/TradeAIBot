# ============================================================
# TradeAIBot — tek compose dosyası
# ------------------------------------------------------------
# Varsayılan (yalnız panel + yerel ağ):
#   docker compose up -d
#
# AI ayrı profil (opsiyonel):
#   docker compose --profile ai up -d
#
# Dış ağdan erişim (Cloudflare Tunnel):
#   docker compose --profile tunnel up -d
#
# Hepsini birlikte:
#   docker compose --profile ai --profile tunnel up -d
#
# Tunnel, dışa GİDEN bağlantı kurar; modemde port açmak gerekmez.
# Erişim yalnızca telefonunuzdaki istemci sertifikasıyla sınırlanır
# (Cloudflare mTLS + WAF). Kurulum: docs/CLOUDFLARE_TUNNEL.md
# ============================================================
services:
  tradeai:
    build:
      context: .
      args:
        INSTALL_AI: "false"
    container_name: tradeai
    restart: unless-stopped
    ports:
      - "${TRADEAI_BIND:-0.0.0.0}:${TRADEAI_PORT:-8080}:${TRADEAI_PORT:-8080}"
    env_file:
      - .env
    environment:
      - TZ=Europe/Istanbul
    volumes:
      - ./Data:/app/Data
      - ./Log:/app/Log
      - ./state:/app/state
      - ./Trade_Durumu:/app/Trade_Durumu
      - ./Trade_Durumu_AI:/app/Trade_Durumu_AI
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, urllib.request; urllib.request.urlopen('http://localhost:%s/api/health' % os.getenv('TRADEAI_PORT', '8080'))\""]
      interval: 30s
      timeout: 5s
      retries: 3

  ai:
    profiles: ["ai"]
    build:
      context: .
      dockerfile: Dockerfile.ai
    container_name: tradeai-ai
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Europe/Istanbul
      - AI_ENABLED=true
    volumes:
      - ./Data:/app/Data
      - ./Log:/app/Log
      - ./state:/app/state
    depends_on:
      - tradeai

  # Cloudflare Tunnel: dışarıdan erişim. Yalnız "tunnel" profili etkinken
  # başlar. Token .env içindeki TUNNEL_TOKEN'dan okunur.
  # Public hostname (Cloudflare paneli): HTTP → tradeai:<TRADEAI_PORT>
  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    container_name: tradeai-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      tradeai:
        condition: service_healthy
    # Tunnel salt okunur bir köprüdür: ek yetki/volume gerekmez.
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
